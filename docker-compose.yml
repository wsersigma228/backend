version: "3.8"

services:
  db:
    image: docker.io/library/postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:Z

  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg_async://myuser:1234@db:5432/mydb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    # Команда для применения миграций перед запуском сервера
    command: sh -c "alembic upgrade head && uvicorn backend.main:api --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app:z # Delete this on prod


  redis:
    image: docker.io/library/redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
